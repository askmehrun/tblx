name: tblx-ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Resolve libtblx from GitHub
        run: |
          go mod tidy
      - name: Vet
        run: go vet ./...
      - name: Build
        run: |
          CGO_ENABLED=0 go build -trimpath -o tblx ./cmd/tblx
          ./tblx --help
